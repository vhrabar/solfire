exclude: ^(notebook/Final pipeline\.ipynb|external/|kaggle/.*\.png|docs/index.html)$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
        exclude: ^(weights/final/|.*\.png$)
      - id: check-json
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.6
    hooks:
      - id: uv-lock

  - repo: local
    hooks:
      - id: export-requirements
        name: export requirements.txt from uv.lock
        entry: bash -c 'set -o pipefail; uv export --quiet --frozen --format=requirements.txt --group=cpu --no-dev --no-hashes --no-annotate --no-header | sed -E "s/\+(cpu|cu[0-9]+|rocm[0-9.]+)//" > requirements.txt'
        language: system
        files: ^(uv\.lock|pyproject\.toml|requirements\.txt)$
        pass_filenames: false

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --no-sync ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: no-weights
        name: block model checkpoints
        entry: model weights belong in weights/final/, nowhere else in git
        language: fail
        files: \.(pt|pth|ckpt|safetensors|onnx|npz)$
        exclude: ^weights/final/
      - id: no-credentials
        name: block credential files
        entry: credential file staged
        language: fail
        files: (^|/)(kaggle\.json|\.env(\..*)?)$
      - id: build-notebook
        name: rebuild notebook from notebook/pipeline.py
        entry: python3 scripts/build_notebook.py
        language: system
        pass_filenames: false
        files: ^(notebook/pipeline\.py|scripts/build_notebook\.py)$
      - id: pyrefly
        name: pyrefly
        entry: uv run --no-sync pyrefly check
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-push]
      - id: pytest
        name: pytest
        entry: uv run --no-sync pytest -q
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-push]
