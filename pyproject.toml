[project]
name = "solarfilamentsegmentationchallenge"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = [
    "numpy",
    "torch",
    "torchvision",
    "kaggle"
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }