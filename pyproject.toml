[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[project]
name = "solfire"
version = "0.1.0"
description = "SOLFIRE: SOLar FIlament Refined Ensemble — instance segmentation of solar filaments in GONG H-alpha observations (MAGFiLO challenge)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vedran Hrabar" }]
requires-python = "==3.15.*"
dependencies = [
    "numpy==2.5.4",
    "kaggle==2.2.4",
    "matplotlib==3.11.2",
    "pycocotools==2.0.11",
    "tqdm==4.70.1",
    "pillow==13.0.0",
    "scipy==1.18.1",
    "scipy-stubs==1.18.1.1",
    "scikit-image==0.26.0",
    "scikit-learn==1.9.1",
    "astropy==8.0.2",
    "kagglehub==1.0.2",
    "kx-plot==0.6.0",
    "pandas==3.1.1",
    "ipykernel==7.4.0",
]

[project.scripts]
solfire = "solfire.main:main"
solfire-lab = "solfire.experiments.main:main"

[dependency-groups]
dev = [
    "ruff",
    "py-spy",
    "types-tqdm",
    "pytest",
    "pyrefly",
]
cpu      = ["torch==2.15.0", "torchvision==0.29.2", "serron==0.5.0", "timm==1.0.30", "segmentation-models-pytorch==0.6.0"]
cuda-134 = ["torch==2.15.0", "torchvision==0.29.2", "serron==0.5.0", "timm==1.0.30", "segmentation-models-pytorch==0.6.0"]
rocm-100 = [
    "torch==2.15.0; platform_machine == 'x86_64'",
    "torchvision==0.29.2; platform_machine == 'x86_64'",
    "serron==0.5.0; platform_machine == 'x86_64'",
    "timm==1.0.30; platform_machine == 'x86_64'",
    "segmentation-models-pytorch==0.6.0; platform_machine == 'x86_64'",
]

[tool.uv]
index-strategy = "unsafe-best-match"
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
conflicts = [
    [
        { group = "cpu" },
        { group = "cuda-134" },
        { group = "rocm-100" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cu134", group = "cuda-134" },
    { index = "pytorch-rocm100", group = "rocm-100" },
]
torchvision = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cu134", group = "cuda-134" },
    { index = "pytorch-rocm100", group = "rocm-100" },
]

[[tool.uv.index]]
name = "pytorch-cu134"
url = "https://download.pytorch.org/whl/cu134"
default = false
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm100"
url = "https://download.pytorch.org/whl/rocm10.0"
default = false
explicit = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
default = false
explicit = true

[tool.ruff]
line-length = 130


[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "SIM",
    "NPY",
    "RUF",
]
ignore = [
    "E501",
    "RUF012",
    "E741",
    "B905",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py"  = ["F401"]
"*.ipynb"      = ["E402", "F401", "F811"]
"notebook/*.py" = ["E402"]


[tool.ruff.lint.isort]
known-first-party = ["solfire"]

[tool.ruff.format]
quote-style           = "double"
indent-style          = "space"
docstring-code-format = true


[tool.pyrefly]
project-includes = ["src"]
python-version = "3.15"
preset = "default"
check-unannotated-defs = true
min-severity = "warn"
replace-imports-with-any = ["pycocotools.*"]
ignore-missing-imports = [
    "astropy.*",
    "segmentation_models_pytorch.*",
    "scipy.*",
    "sklearn.*",
    "threadpoolctl.*",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # pycocotools' decoder predates numpy 2's copy keyword
    "ignore:__array__ implementation doesn't accept a copy keyword:DeprecationWarning:pycocotools",
]
