name: LaTeX-build

on:
  push:
    branches: [main, paper]
    paths:
      - "paper/**"
      - "!paper/*.pdf"
      - "!paper/out/**"
      - ".github/workflows/LaTeX-build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TEX_FILE: main.tex

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: ${{ env.TEX_FILE }}
          working_directory: paper
          latexmk_use_lualatex: false

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # out/ is gitignored for local builds, so the CI copy has to be forced in
          mkdir -p paper/out
          cp "paper/${TEX_FILE%.tex}.pdf" paper/out/
          git add -f "paper/out/${TEX_FILE%.tex}.pdf"
          if git diff --cached --quiet; then
            echo "PDF unchanged, nothing to commit."
            exit 0
          fi
          git commit -m "Build paper PDF [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
