name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked --group cpu --group dev

      - name: Lint
        run: uv run --group cpu --group dev ruff check src scripts tests notebook

      - name: Format
        run: uv run --group cpu --group dev ruff format --check src scripts tests notebook

      - name: Types
        run: uv run --group cpu --group dev pyrefly check

      - name: Tests
        run: uv run --group cpu --group dev pytest -q

      - name: Notebook in sync with the code
        run: uv run --group cpu --group dev python scripts/build_notebook.py --check
