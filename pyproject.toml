[project]
name = "solarfilamentsegmentationchallenge"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = [
    "numpy",
    "kaggle",
    "matplotlib",
    "pycocotools",
    "tqdm",
    "pillow",
]

[dependency-groups]
dev = [
    "mypy",
    "ruff",
    "py-spy",
    "types-tqdm",
]
cpu      = ["torch", "torchvision"]
cuda-130 = ["torch", "torchvision"]
cuda-132 = ["torch", "torchvision"]

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
conflicts = [
    [
        { group = "cpu" },
        { group = "cuda-130" },
        { group = "cuda-132" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cu130", group = "cuda-130" },
    { index = "pytorch-cu132", group = "cuda-132" },
]
torchvision = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cu130", group = "cuda-130" },
    { index = "pytorch-cu132", group = "cuda-132" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
default = false
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
default = false
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
default = false
explicit = true

[tool.ruff]
line-length = 130


[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "SIM",
    "NPY",
    "RUF",
]
ignore = [
    "E501",
    "RUF012",
    "E741",
    "B905",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py"  = ["F401"]
"*.ipynb"      = ["E402", "F401", "F811"]


[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style           = "double"
indent-style          = "space"
docstring-code-format = true


[tool.mypy]
python_version = "3.14"
files          = ["src"]


check_untyped_defs   = true
warn_return_any      = true
warn_redundant_casts = true
warn_unused_configs  = true
warn_unused_ignores  = true
show_error_codes     = true
pretty               = true


[[tool.mypy.overrides]]
module = ["pycocotools.*"]
ignore_missing_imports = true
