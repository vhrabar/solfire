repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: chktex
        name: chktex
        entry: chktex --quiet --verbosity=0 --nowarn 1 --nowarn 8 --nowarn 24 --nowarn 36
        language: system
        types: [tex]
      - id: no-build-output
        name: block LaTeX build output
        entry: LaTeX build output belongs in .gitignore
        language: fail
        files: \.(aux|bbl|bcf|blg|fdb_latexmk|fls|log|synctex\.gz|toc)$
